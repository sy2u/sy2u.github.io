---
layout: compress
---

<!doctype html>
<html lang="en" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body>

    {% include browser-upgrade.html %}
    {% include masthead.html %}

    <div id="main" role="main">
      {% include sidebar.html %}
    
      <article class="page{% if page.layout == 'blog' %} page--blog{% endif %}" itemscope itemtype="http://schema.org/CreativeWork">
        {% if page.title %}<meta itemprop="headline" content="{{ page.title | markdownify | strip_html | strip_newlines | escape_once }}">{% endif %}
        <div class="page__inner-wrap">
          <section class="page__content" itemprop="text">
            {{ content }}
          </section>
        </div>
      </article>
    </div>

    {% include scripts.html %}

  <footer style="text-align: center; font-size: 0.85em; color: #999; padding: 20px 0;">
    Site last updated: <time id="about-last-updated" datetime="{{ site.data.about-update.date }}" data-repository="{{ site.repository | escape }}">{{ site.data.about-update.date }}</time>
  </footer>
  <script src="{{ '/assets/js/about-updated.js' | relative_url }}" defer></script>
  </body>
</html>
